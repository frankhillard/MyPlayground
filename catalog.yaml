# Games the dashboard can launch. Edit this file on the server.
# Each repository must contain a Dockerfile that listens on 0.0.0.0
# and on containerPort. With PUBLISH_HOST, Open uses http://127.0.0.1:<hostPort>.
# id is a hostname label. Capitals are folded to lowercase.
# hostPort is the localhost port used when the dashboard runs with PUBLISH_HOST.
games:
  - id: contraption
    title: Contraption
    description: Incredible Machine-like puzzle game.
    git: https://github.com/frankhillard/IncredibleMachine.git
    ref: main
    dockerfile: Dockerfile
    containerPort: 8080
    hostPort: 8081
    healthPath: /

  - id: cordon
    title: Cordon
    description: Jezzball-like game.
    git: https://github.com/frankhillard/jezzball.git
    ref: main
    dockerfile: Dockerfile
    containerPort: 80
    hostPort: 8082
    healthPath: /

  - id: blasterman
    title: Blasterman
    description: Bomberman-like game.
    git: https://github.com/frankhillard/bomberman.git
    ref: main
    dockerfile: Dockerfile
    containerPort: 8080
    hostPort: 8083
    healthPath: /

# Repositories listed on the dev tab.
dev:
  - id: ball-tracker
    title: BallTracker
    description: launch the camera and track the ball and interpolate the curve function.
    git: https://github.com/frankhillard/newton_project_ai.git
    ref: main
    image: |-
      docker build -t newton-live .
      xhost +local:docker
    exec: |-
      docker run --rm -it \
        --device /dev/video0 \
        --group-add video \
        -e DISPLAY=$DISPLAY \
        -e QT_X11_NO_MITSHM=1 \
        -v /tmp/.X11-unix:/tmp/.X11-unix \
        newton-live python live.py --max-poly-degree 2
