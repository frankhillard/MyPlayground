<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --card: #141414;
        --ink: #f5f5f5;
        --muted: #a3a3a3;
        --line: #2a2a2a;
        --accent: #1f8a6e;
        --accent-ink: #f4fff9;
        --danger: #ff8d8d;
        --danger-bg: #2a1212;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }

      @font-face {
        font-family: "Caveat";
        src: url("/fonts/Caveat.ttf") format("truetype");
        font-weight: 400 700;
        font-display: swap;
      }

      header,
      main {
        margin-inline: auto;
      }

      header {
        width: min(76rem, calc(100% - 2rem));
        padding: 1.2rem 0 1rem;
      }

      main {
        width: min(52rem, calc(100% - 2rem));
      }

      header h1 {
        margin: 0 0 0.35rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .logo text {
        font-family: Caveat, "Segoe Script", cursive;
        font-size: 108px;
        font-weight: 600;
      }

      .logo-shadow {
        fill: #24160c;
        transform: translate(4px, 6px);
      }

      .logo-face {
        fill: #b08948;
        stroke: #2a1c10;
        stroke-width: 1.5px;
        paint-order: stroke fill;
      }

      header p {
        margin: 0;
        color: var(--muted);
        text-align: center;
      }

      .token {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        margin: 1.25rem auto 0;
        max-width: 22rem;
        text-align: center;
      }

      .token input {
        width: 100%;
      }

      .token span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      input {
        font: inherit;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        background: #111;
        color: inherit;
      }

      #notice {
        min-height: 1.5rem;
        margin: 0.75rem 0 0;
        color: var(--danger);
      }

      #games {
        display: grid;
        gap: 0.75rem;
        padding-bottom: 3rem;
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        overflow: hidden;
      }

      article img {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }

      .heading {
        padding: 1rem 1.1rem 0.85rem;
      }

      .body {
        padding: 0.9rem 1.1rem 1.1rem;
      }

      article h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .description {
        margin: 0.35rem 0 0;
        color: var(--muted);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: baseline;
        margin-top: 0.8rem;
      }

      .status {
        font-size: 0.85rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .status[data-status="running"] {
        color: var(--accent);
      }
      .status[data-status="error"] {
        color: var(--danger);
      }
      .status[data-status="cloning"],
      .status[data-status="building"] {
        color: #e0b15a;
      }

      .url {
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .error {
        margin: 0.6rem 0 0;
        color: var(--danger);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      button,
      a.open {
        font: inherit;
        text-decoration: none;
        border-radius: 0.45rem;
        padding: 0.4rem 0.85rem;
        border: 1px solid transparent;
        cursor: pointer;
      }

      button:disabled,
      a.open[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.45;
      }

      button.launch {
        background: var(--accent);
        color: var(--accent-ink);
      }

      button.stop {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: #f0d0d0;
      }

      a.open {
        background: #111;
        color: var(--ink);
        border-color: var(--line);
      }

      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <span class="visually-hidden">My playground</span>
        <svg class="logo" viewBox="0 0 720 250" aria-hidden="true">
          <defs>
            <path id="title-arc" d="M 16 200 Q 360 78 704 200" />
          </defs>
          <text class="logo-shadow">
            <textPath href="#title-arc" startOffset="50%" text-anchor="middle">My playground</textPath>
          </text>
          <text class="logo-face">
            <textPath href="#title-arc" startOffset="50%" text-anchor="middle">My playground</textPath>
          </text>
        </svg>
      </h1>
      <p>
        Launch a game server as a docker container, play it in your browser,
        stop the container when finished.
      </p>
      <label class="token">
        <span>Admin token</span>
        <input
          id="token"
          type="password"
          autocomplete="current-password"
          spellcheck="false"
        />
      </label>
      <p id="notice" role="status"></p>
    </header>
    <main id="games"></main>
    <script>
      const tokenInput = document.querySelector("#token");
      const notice = document.querySelector("#notice");
      const root = document.querySelector("#games");
      const tokenKey = "playgroundAdminToken";
      const labels = {
        stopped: "Stopped",
        cloning: "Cloning",
        building: "Building",
        running: "Running",
        error: "Error",
      };

      tokenInput.value = sessionStorage.getItem(tokenKey) || "";
      tokenInput.addEventListener("input", () => {
        sessionStorage.setItem(tokenKey, tokenInput.value.trim());
      });

      function setNotice(message) {
        notice.textContent = message || "";
      }

      function cardFor(id) {
        return root.querySelector(`[data-id="${CSS.escape(id)}"]`);
      }

      function buildCard(game) {
        const card = document.createElement("article");
        card.dataset.id = game.id;

        const image = document.createElement("img");
        image.alt = "";
        image.hidden = true;
        const heading = document.createElement("div");
        heading.className = "heading";
        const body = document.createElement("div");
        body.className = "body";
        const title = document.createElement("h2");
        const description = document.createElement("p");
        description.className = "description";
        const meta = document.createElement("div");
        meta.className = "meta";
        const status = document.createElement("span");
        status.className = "status";
        const url = document.createElement("span");
        url.className = "url";
        meta.append(status, url);
        const error = document.createElement("p");
        error.className = "error";
        const actions = document.createElement("div");
        actions.className = "actions";

        const launch = document.createElement("button");
        launch.type = "button";
        launch.className = "launch";
        launch.textContent = "Launch";
        launch.addEventListener("click", () => act(game.id, "start"));

        const stop = document.createElement("button");
        stop.type = "button";
        stop.className = "stop";
        stop.textContent = "Stop";
        stop.addEventListener("click", () => act(game.id, "stop"));

        const open = document.createElement("a");
        open.className = "open";
        open.textContent = "Play";
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        open.setAttribute("role", "link");
        open.addEventListener("click", (event) => {
          if (open.getAttribute("aria-disabled") === "true")
            event.preventDefault();
        });

        actions.append(launch, stop, open);
        heading.append(title, description);
        body.append(meta, error, actions);
        card.append(heading, image, body);
        return card;
      }

      function updateCard(card, game) {
        const image = card.querySelector("img");
        if (game.image) {
          if (image.getAttribute("src") !== game.image) image.src = game.image;
          image.alt = game.title;
          image.hidden = false;
        } else {
          image.removeAttribute("src");
          image.alt = "";
          image.hidden = true;
        }
        card.querySelector("h2").textContent = game.title;
        card.querySelector(".description").textContent = game.description;
        const status = card.querySelector(".status");
        status.dataset.status = game.status;
        status.textContent = labels[game.status] || game.status;
        card.querySelector(".url").textContent = game.url;
        const error = card.querySelector(".error");
        error.textContent = game.error || "";
        error.hidden = !game.error;

        const busy = game.status === "cloning" || game.status === "building";
        card.querySelector(".launch").disabled = busy;
        card.querySelector(".stop").disabled = game.status === "stopped";

        const open = card.querySelector(".open");
        const runnable =
          game.status === "running" && /^https?:\/\//.test(game.url);
        if (runnable) {
          open.href = game.url;
          open.removeAttribute("aria-disabled");
          open.tabIndex = 0;
        } else {
          open.removeAttribute("href");
          open.setAttribute("aria-disabled", "true");
          open.tabIndex = -1;
        }
      }

      function render(games) {
        const seen = new Set();
        for (const game of games) {
          seen.add(game.id);
          let card = cardFor(game.id);
          if (!card) {
            card = buildCard(game);
            root.append(card);
          }
          updateCard(card, game);
        }
        for (const card of [...root.querySelectorAll("article")]) {
          if (!seen.has(card.dataset.id)) card.remove();
        }
        let empty = root.querySelector(".empty");
        if (games.length === 0) {
          if (!empty) {
            empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "No games in the catalog.";
            root.append(empty);
          }
        } else if (empty) {
          empty.remove();
        }
      }

      async function load() {
        try {
          const response = await fetch("/api/games");
          if (!response.ok) {
            setNotice("Could not load games.");
            return;
          }
          const body = await response.json();
          render(body.games || []);
        } catch (_error) {
          setNotice("Could not load games.");
        }
      }

      async function act(id, action) {
        setNotice("");
        let response;
        try {
          response = await fetch(
            `/api/games/${encodeURIComponent(id)}/${action}`,
            {
              method: "POST",
              headers: { Authorization: `Bearer ${tokenInput.value.trim()}` },
            },
          );
        } catch (_error) {
          setNotice("Request failed.");
          return;
        }
        if (response.status === 401) {
          setNotice("Start and stop need a valid admin token.");
          return;
        }
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          setNotice(body.detail || "Request failed.");
          return;
        }
        await load();
      }

      load();
      setInterval(load, 2000);
    </script>
  </body>
</html>
